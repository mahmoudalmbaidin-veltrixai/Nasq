[project]
name = "nasq-core"
version = "0.1.0"
description = "Shared foundations: settings, ids, structured logging, errors and database access."
requires-python = ">=3.12,<3.13"
dependencies = [
  "psycopg[binary]==3.3.9",
  "pydantic==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasq_core"]
