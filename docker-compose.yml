# Local development stack. Start with `make dev`.
# Every port binds to 127.0.0.1 only; host ports can be moved with *_HOST_PORT variables.
# Passwords default to CHANGE_ME placeholders; override them in a local .env (never committed).
name: nasq

x-app-env: &app-env
  APP_ENV: local
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  READINESS_TIMEOUT_SECONDS: ${READINESS_TIMEOUT_SECONDS:-2}
  DATABASE_URL: postgresql+psycopg://veltrix_app:${DATABASE_APP_PASSWORD:-CHANGE_ME}@postgres:5432/veltrix
  DATABASE_MIGRATION_URL: postgresql+psycopg://veltrix_owner:${DATABASE_OWNER_PASSWORD:-CHANGE_ME}@postgres:5432/veltrix

services:
  postgres:
    image: postgres:16.16-bookworm
    environment:
      POSTGRES_DB: veltrix
      POSTGRES_USER: veltrix_owner
      POSTGRES_PASSWORD: ${DATABASE_OWNER_PASSWORD:-CHANGE_ME}
      DATABASE_APP_PASSWORD: ${DATABASE_APP_PASSWORD:-CHANGE_ME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veltrix_owner -d veltrix"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-env
      WORKER_HEARTBEAT_SECONDS: ${WORKER_HEARTBEAT_SECONDS:-10}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "nasq_worker.health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${MAILPIT_HOST_PORT:-8025}:8025"
      - "127.0.0.1:${SMTP_HOST_PORT:-1025}:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage (ADR-006). The task named MinIO, but MinIO no longer
  # publishes community images; RustFS is the agreed local substitute.
  rustfs:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-CHANGE_ME}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-CHANGE_ME}
    volumes:
      - storage-data:/data
    ports:
      - "127.0.0.1:${STORAGE_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
  storage-data:
