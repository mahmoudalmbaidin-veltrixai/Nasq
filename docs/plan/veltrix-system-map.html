<style>
:root{
  --bg:#F4F6F8; --card:#FFFFFF; --ink:#18212C; --muted:#5B6676; --line:#D6DDE4; --soft:#EBEFF3;
  --accent:#1D5FA0; --accent-ink:#FFFFFF; --cc:#B45309; --cx:#1D6FA3; --shadow:0 1px 2px rgba(16,24,40,.06);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0F151D; --card:#17202B; --ink:#E6EBF1; --muted:#9AA6B5; --line:#2A3644; --soft:#1E2834;
    --accent:#5FA8E8; --accent-ink:#0F151D; --cc:#F0A44B; --cx:#5DB2E8; --shadow:none; color-scheme: dark; }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto} }
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.55}
button,input{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 20px;flex-wrap:wrap}
.brand{text-align:left;font-weight:700;font-size:17px;border:0;background:none;padding:4px 0;cursor:pointer;margin-right:auto}
.brand small{display:block;font-weight:400;font-size:12.5px;color:var(--muted)}
.nav{display:flex;gap:6px}
.nav button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 13px;cursor:pointer}
.nav button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{position:relative}
.search input{width:250px;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.results{position:absolute;right:0;left:0;top:calc(100% + 4px);background:var(--card);border:1px solid var(--line);border-radius:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:360px;overflow:auto;display:none;z-index:40}
.results button{display:flex;gap:10px;align-items:center;width:100%;padding:9px 12px;border:0;background:none;text-align:left;cursor:pointer}
.results button.act,.results button:hover{background:var(--soft)}
.results small{color:var(--muted);margin-left:auto;white-space:nowrap}

/* step rail */
.rail{max-width:1120px;margin:0 auto;padding:2px 20px 10px;display:none}
.rail.show{display:block}
.rail ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.rail li button{width:100%;border:0;background:none;cursor:pointer;padding:6px 2px 2px;text-align:left;display:flex;flex-direction:column;gap:5px}
.rail .tick{height:5px;border-radius:3px;background:var(--line)}
.rail .lbl{font-size:12px;color:var(--muted);line-height:1.25}
.rail li.on .lbl{color:var(--ink);font-weight:650}
.rail li.on .tick{height:7px}

main:focus{outline:none}
main{max-width:1120px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.12;margin:8px 0 12px;letter-spacing:-.015em}
h2{font-size:24px;line-height:1.25;margin:40px 0 6px;letter-spacing:-.01em}
h3{font-size:15px;margin:28px 0 10px;color:var(--muted);font-weight:650}
.lead{font-size:18.5px;max-width:64ch;margin:0 0 18px}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 16px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* step cards */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px;counter-reset:s}
.step{position:relative;text-align:left;border:1px solid var(--line);border-top:5px solid var(--c);background:var(--card);border-radius:12px;
  padding:16px 16px 14px;cursor:pointer;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-height:168px}
.step:hover{border-color:var(--c)}
.step .num{font-size:30px;font-weight:700;color:var(--c);line-height:1}
.step .t{font-weight:700;font-size:17px;line-height:1.25}
.step .q{color:var(--muted);font-size:14.5px}
.step .n{margin-top:auto;font-size:13px;color:var(--muted)}
.around{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.around .step{border-top-width:1px;border-left:5px solid var(--c);min-height:0}
.words{display:grid;grid-template-columns:1fr 1fr;gap:0 28px;margin-top:10px}
.words div{border-top:1px solid var(--line);padding:10px 0}
.words b{display:block}

/* parts */
.crumb{font-size:14px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.crumb button{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.tag{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:var(--muted)}
.dot{width:10px;height:10px;border-radius:50%;flex:0 0 10px;background:var(--c)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:12px}
.part{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:14px 15px;cursor:pointer;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.part:hover{border-color:var(--c)}
.part .nm{font-weight:650;display:flex;gap:8px;align-items:center}
.part .ds{font-size:14.5px;color:var(--muted)}
.big{font-size:19px;max-width:62ch;margin:6px 0 4px}

/* connection map */
.net{position:relative;display:grid;grid-template-columns:1fr minmax(170px,230px) 1fr;gap:0 70px;align-items:center;margin-top:8px;
  background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px}
.net .col{display:flex;flex-direction:column;gap:8px;position:relative;z-index:1}
.net .col h4{margin:0 0 4px;font-size:13px;color:var(--muted);font-weight:650}
.net .col.out h4{text-align:left}
.node{display:flex;gap:9px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 10px;cursor:pointer}
.node:hover{border-color:var(--c)}
.node .nm{font-size:14.5px;font-weight:600;line-height:1.25}
.node .rl{font-size:12.5px;color:var(--muted);line-height:1.25}
.core{position:relative;z-index:1;text-align:center;background:var(--c);color:#fff;border-radius:14px;padding:16px 14px;font-weight:700;line-height:1.3;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 22%,transparent)}
.core small{display:block;font-weight:500;opacity:.9;font-size:12.5px;margin-top:3px}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:visible}
.wires path{fill:none;stroke-width:1.6;stroke-dasharray:5 7;animation:flow 1.4s linear infinite;opacity:.75}
@keyframes flow{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion: reduce){ .wires path{animation:none} }
.empty{font-size:14px;color:var(--muted);padding:6px 0}

.tasks{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.tasks li{border-bottom:1px solid var(--line)}
.tasks button{display:flex;gap:12px;width:100%;align-items:center;text-align:left;background:none;border:0;padding:10px 2px;cursor:pointer}
.tasks button:hover .tt{text-decoration:underline}
.tid{font-weight:700;font-variant-numeric:tabular-nums;min-width:58px}
.own{font-size:12px;font-weight:700;border:1px solid currentColor;border-radius:5px;padding:1px 7px;margin-left:auto;white-space:nowrap}
.own.CC{color:var(--cc)} .own.CX{color:var(--cx)}
details.tech{margin-top:20px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
details.tech summary{cursor:pointer;padding:11px 14px;font-weight:600}
details.tech .in{padding:0 14px 14px;font-size:14.5px}
details.tech pre{white-space:pre-wrap;font:12.5px/1.5 "IBM Plex Mono",Consolas,monospace;background:var(--soft);border-radius:8px;padding:12px;max-height:380px;overflow:auto;margin:0 0 10px}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:12px 0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:34px;flex-wrap:wrap}
.pager .btn{max-width:48%}
.pager .btn small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.pager .btn span{display:block;text-align:left}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14.5px}

/* tour */
.tourhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots button{width:22px;height:8px;border-radius:4px;border:0;background:var(--line);cursor:pointer;padding:0}
.dots button.on{background:var(--accent)}
.dots button.done{background:color-mix(in srgb,var(--accent) 45%,var(--line))}
.tourbox{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px 26px 24px;margin-top:16px;border-left:6px solid var(--c)}
.tourbox h1{margin-top:4px}
.tourbox p{font-size:18.5px;max-width:62ch;margin:0}

@media (max-width:900px){
  .steps,.around{grid-template-columns:1fr 1fr}
}
@media (max-width:720px){
  .bar{padding:8px 14px;gap:8px 10px}
  .brand small{display:none}
  .nav button{padding:6px 10px;font-size:14px}
  .search{flex:1 1 100%;order:3}
  .search input{width:100%}
  main{padding:18px 14px 70px}
  .rail{padding:0 14px 8px}
  .rail .lbl{display:none}
  .rail li.on .lbl{display:block;position:absolute;left:14px;right:14px;margin-top:4px}
  .rail{position:relative;padding-bottom:26px}
  .steps,.around{grid-template-columns:1fr}
  .step{min-height:0;flex-direction:row;align-items:baseline;flex-wrap:wrap;gap:4px 12px}
  .step .num{font-size:24px;min-width:26px}
  .step .t{flex:1}
  .step .q,.step .n{flex-basis:100%;padding-left:38px}
  .around .step .q,.around .step .n{padding-left:0}
  .words{grid-template-columns:1fr}
  .net{grid-template-columns:1fr;gap:12px;padding:16px 14px}
  .wires{display:none}
  .core{order:0}
  .net .col.in{order:-1}
  .net .col.in::after,.core::after{content:"";display:block;height:0}
  .pager .btn{max-width:100%;flex:1 1 100%}
  .tourbox{padding:20px 18px}
  .dots button{width:16px}
  .dots{gap:4px}
  .tourbox p{font-size:17px}
}
/* ---------- mind map ---------- */
main.wide{max-width:none;padding:0}
.mm{position:relative;display:grid;grid-template-columns:1fr 370px;min-height:420px}
.mmstage{position:relative;overflow:hidden;background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:24px 24px}
.mmstage svg{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.mmstage svg:active{cursor:grabbing}
.mmtools{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2;pointer-events:none}
.mmtools .btn{pointer-events:auto;padding:7px 12px;font-size:14px;box-shadow:var(--shadow)}
.mmtools .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.mmhint{position:absolute;left:12px;bottom:12px;max-width:430px;font-size:13.5px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;z-index:2}
.mmpanel{border-left:1px solid var(--line);background:var(--card);overflow:auto;padding:18px 20px 30px}
.mmpanel h2{margin:6px 0 6px;font-size:22px}
.mmpanel p{margin:0 0 10px}
.mmpanel h3{margin:20px 0 8px}
.mmlist{list-style:none;margin:0;padding:0}
.mmlist li{border-top:1px solid var(--line)}
.mmlist button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:8px 0;cursor:pointer}
.mmlist button:hover .nm{text-decoration:underline}
.mmlist .rl{margin-left:auto;font-size:12.5px;color:var(--muted);text-align:right;max-width:45%}
.sheet-handle{display:none}
.lk{fill:none;stroke-linecap:round}
.syn{fill:none;stroke-width:1.8;opacity:.85}
.syn.all{stroke-width:1;opacity:.22}
.mnode{cursor:pointer}
.mnode text{paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;fill:var(--ink)}
.mnode.leaf text{font-size:13.5px}
.mnode.leaf circle{stroke:var(--bg);stroke-width:2}
.mnode.branch text{font-size:14px;font-weight:700;fill:#fff;stroke:none}
.mnode.branch .cnt{font-size:11.5px;font-weight:600;fill:var(--muted);stroke:var(--bg);stroke-width:4px;paint-order:stroke}
.mnode.dim{opacity:.22}
.mnode.sel circle{stroke:var(--ink);stroke-width:3}
.mnode.sel text{font-weight:700}
.mnode.hl circle{stroke:var(--ink);stroke-width:2}
.mnode.hl rect{stroke:var(--ink);stroke-width:2.5}
.mnode:focus-visible{outline:none}
.mnode:focus-visible circle,.mnode:focus-visible rect{stroke:var(--accent);stroke-width:3}
.halo{opacity:.18}
@media (max-width:720px){
  .mm{grid-template-columns:1fr}
  .mmtools{gap:5px;top:8px;left:8px;right:8px}
  .mmtools .btn{padding:5px 9px;font-size:13px}
  .wo{display:none}
  .mmhint{display:none}
  .mmpanel{position:absolute;left:0;right:0;bottom:0;max-height:55%;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    box-shadow:0 -10px 30px rgba(0,0,0,.18);transform:translateY(calc(100% - 54px));transition:transform .25s;padding-top:0;z-index:3}
  .mmpanel.open{transform:none}
  .sheet-handle{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--card);padding:12px 0 8px;border:0;width:100%;font-weight:650;cursor:pointer;z-index:1}
  .sheet-handle::before{content:"";position:absolute;top:5px;left:50%;width:36px;height:4px;margin-left:-18px;border-radius:2px;background:var(--line)}
}
@media (prefers-reduced-motion: reduce){ .mmpanel{transition:none} }

</style>
</head>
<body>
<div class="top">
  <div class="bar">
    <button class="brand" onclick="go('#/')">Veltrix system map<small>How the platform works, in plain words</small></button>
    <nav class="nav" aria-label="Main">
      <button id="nHome" onclick="go('#/')">Overview</button>
      <button id="nTour" onclick="go('#/tour/1')">Guided tour</button>
      <button id="nMap" onclick="go('#/map')">Mind map</button>
    </nav>
    <div class="search">
      <input id="q" type="search" placeholder="Search a part, screen or task" aria-label="Search the system" autocomplete="off">
      <div class="results" id="res" role="listbox"></div>
    </div>
  </div>
  <div class="rail" id="rail"><ol></ol></div>
</div>
<main id="view" tabindex="-1"></main>

<script>
const D = {"steps":[{"n":1,"title":"Information comes in","q":"Where does the data come from?","color":"#A06A3F","text":"Orders, products, stock and machine details arrive from spreadsheets or the customer's existing systems. Nothing goes live until it has been checked.","parts":["files","erp","wms","mes","maps","o_api","f_import","f_valid","f_sot"]},{"n":2,"title":"Information is organized","q":"Where is it kept?","color":"#17A08B","text":"The checked data is stored in a clear structure: products, orders, machines, calendars, stock and costs. Before every calculation a frozen copy is taken.","parts":["d_org","d_product","d_order","d_partner","d_resource","d_routing","d_calendar","d_stock","d_cost","d_snapshot","f_units","f_fresh"]},{"n":3,"title":"Rules are set","q":"What should the plan aim for?","color":"#4C6FD9","text":"The planner chooses goals and rules, such as 'deliver on time first' or 'this product only runs on lines 1 and 2'. Work that is already running is locked.","parts":["f_config","f_template","f_coverage","f_entitle","l_locks"]},{"n":4,"title":"Plans are calculated","q":"Who works out the plan?","color":"#D9940F","text":"Specialised engines search through millions of options in the background and return the best plan they can find, together with an honest status.","parts":["s_contract","s_queue","s_profile","s_solver","e_prod","e_trans","e_inv","e_orch","s_status"]},{"n":5,"title":"Plans are checked and compared","q":"Is the plan right?","color":"#8A63D2","text":"A separate checker re-tests the plan against every rule. The planner can try what-if versions, compare them side by side and read why things happened.","parts":["s_validator","l_scenario","l_compare","l_version","l_edit","l_explain"]},{"n":6,"title":"People approve","q":"Who says yes?","color":"#DA4A5E","text":"A manager reviews and approves. The system first makes sure the plan is valid, up to date and not overtaken by a newer version.","parts":["l_states","l_approval","o_alert"]},{"n":7,"title":"Plans are carried out","q":"How does it reach the floor?","color":"#4FA444","text":"The approved plan is sent to the factory, warehouse or drivers exactly once. Real progress comes back, and if something breaks a new plan is made.","parts":["o_export","o_outbox","o_recon","d_event","o_monitor","l_replan","email"]},{"n":8,"title":"Results are measured","q":"Did it help?","color":"#2F9FD0","text":"A scorecard compares the plan, what really happened and the old way of working, and calculates the money impact honestly.","parts":["o_kpi","o_fin","o_report"]}],"around":[{"id":"people","title":"People who use it","q":"Who works with Veltrix?","color":"#7D8796","text":"Each person sees only what their job needs. One person can hold several roles in a small company.","parts":["r_platform","r_orgadmin","r_data","r_planner","r_approver","r_exec","r_finance","r_support"]},{"id":"screens","title":"Screens they see","q":"What does it look like?","color":"#3A7CA5","text":"Thirteen screens, in Arabic and English. People only see the engines their company uses.","parts":["u_signin","u_overview","u_datacenter","u_master","u_engcfg","u_workspace","u_prodres","u_transres","u_invres","u_approvals","u_execmon","u_impact","u_admin"]},{"id":"safety","title":"Keeping it safe and running","q":"How is it protected?","color":"#7F8C3A","text":"Everything that keeps customer data private, the service fast and the data recoverable. It works quietly behind every step.","parts":["f_tenant","f_auth","f_authz","f_audit","x_security","x_observe","x_backup","x_perf","x_deploy","x_support"]},{"id":"builders","title":"Who builds it and when","q":"How does it get made?","color":"#C2609F","text":"Two AI coding tools build and check each other's work, while people approve the important decisions. It is released in stages.","parts":["t_cc","t_cx","t_or","t_po","t_cust","rel_r1","rel_r2","rel_r3","rel_ext"]}],"tour":[{"title":"Meet the factory","step":0,"parts":["d_org","r_planner"],"text":"A packaging factory has several production lines and many customer orders. Every week, the planner must decide what runs on which line and when. Doing this by hand is slow and mistakes are costly. Let's follow one week of planning through Veltrix."},{"title":"Orders arrive","step":1,"parts":["files","erp","f_import"],"text":"The planner uploads next week's orders and the available materials. They first land in a holding area, not in the live system."},{"title":"The data is checked","step":1,"parts":["f_valid","r_data","u_datacenter"],"text":"Automatic checks find that one product is missing its machine speed. The data steward fixes it, and only then is the data published."},{"title":"Everything is organized and frozen","step":2,"parts":["d_order","d_resource","d_calendar","d_stock","d_snapshot"],"text":"Orders, machines, shifts and materials are stored in a clear structure. A frozen copy is taken so the plan can always be traced back to the exact data it used."},{"title":"The planner sets the goals","step":3,"parts":["f_config","f_template","u_engcfg"],"text":"The planner starts from the batch manufacturing setup and chooses the goals: first deliver on time, then keep machine changeovers low."},{"title":"The engine calculates","step":4,"parts":["s_queue","e_prod","s_solver","s_status"],"text":"The production engine runs in the background and returns a plan. It says honestly how good the plan is. Two orders will be late."},{"title":"A second checker double-checks","step":5,"parts":["s_validator","l_version"],"text":"A separate checker, built by a different team member, re-tests every rule: no machine double-booked, no material used before it arrives. The plan passes."},{"title":"Try a what-if","step":5,"parts":["l_scenario","l_compare","l_explain","u_workspace"],"text":"The planner copies the plan and adds a Saturday shift. The comparison shows the extra cost of overtime against the cost of being late, and explains why each order moved."},{"title":"The manager approves","step":6,"parts":["l_approval","r_approver","u_approvals","f_audit"],"text":"The planner submits the better version. The manager approves it after the system confirms it is valid and up to date. Who approved what, and when, is recorded."},{"title":"The plan goes to the floor","step":7,"parts":["o_export","o_outbox","mes"],"text":"The approved schedule is sent to the factory floor exactly once, clearly labelled with its version."},{"title":"Something breaks","step":7,"parts":["d_event","l_replan","l_locks","u_execmon"],"text":"On Tuesday a line breaks down. Veltrix keeps all work already finished or running in place, and proposes a new plan for the rest. The manager reviews the changes before they are released."},{"title":"Measure the result","step":8,"parts":["o_kpi","o_fin","o_report","r_finance","u_impact"],"text":"At the end of the week the scorecard compares the plan, what really happened and the old way of planning. Finance signs off the money impact."},{"title":"Behind every step","step":0,"parts":["f_tenant","f_authz","x_security","x_backup"],"text":"Throughout the week, a wall keeps each company's data private, every action is permission-checked, and backups protect against loss."},{"title":"Who built all this","step":0,"parts":["t_cc","t_cx","t_or","t_po","rel_r1"],"text":"Claude Code designed the system and wrote the engines. Codex built features and the independent checkers, and reviewed Claude Code's work. Humans approved the maths, the scope and the final acceptance. This is Release 1; deliveries and stock planning come next."}],"words":[["Engine","The part that does the maths and produces a plan. Veltrix has three: production, delivery and stock."],["Plan","A concrete answer: what happens, where and when."],["Rule (constraint)","Something the plan must respect, like a machine's capacity or a delivery deadline."],["Goal (objective)","What the plan tries to improve, like fewer late orders or lower cost."],["Scenario","A what-if copy of a plan, used for comparing options."],["Checker (validator)","A separate program that re-tests a plan against every rule."],["Snapshot","A frozen copy of the data used for one calculation."],["Version","A numbered, saved plan. Approved versions never change."]],"nodes":[{"id":"erp","label":"ERP","group":"ext","desc":"Keeps the core business records. Source of truth for orders; receives approved purchase proposals and plans through the outbox.","prd":"§3, §10, §14","req":"INT01","easy":"The customer's main business system. It already holds orders, products and customers. Veltrix reads from it and sends approved plans back.","tasks":["P7-01","P7-04","P14-04"]},{"id":"mes","label":"Execution system (MES)","group":"ext","desc":"Source of truth for actual status. Sends execution events and receives released plans.","prd":"§3, §10, §18","req":"INT01","easy":"The system on the factory floor that records what actually happened: which job started, finished or stopped.","tasks":["P7-01","P7-03"]},{"id":"wms","label":"Warehouse system","group":"ext","desc":"Not replaced by Veltrix. Supplies stock positions and batch status.","prd":"§3, §14","req":"","easy":"The warehouse system. It tells Veltrix how much stock is on the shelves.","tasks":["P14-02"]},{"id":"files","label":"Excel and CSV files","group":"ext","desc":"The first data source for most customers. Enter through the staged import pipeline.","prd":"§10","req":"DAT01","easy":"Excel or CSV sheets the customer uploads, for example next week's orders.","tasks":["P2-04","P2-07"]},{"id":"maps","label":"Road travel-time provider","group":"ext","desc":"Supplies road time and distance matrices for routing. Source, timestamp, coverage, cost and licensing are recorded.","prd":"§13","req":"LOG03","easy":"A map service that says how long it really takes to drive between two addresses on real roads.","tasks":["P13-02","P13-06"]},{"id":"email","label":"Email service","group":"ext","desc":"Delivers alerts when enabled. Never carries secrets or personal data.","prd":"§21","req":"","easy":"Delivers alert emails. They never contain passwords or personal data.","tasks":["P9-04"]},{"id":"r_platform","label":"Platform administrator","group":"role","desc":"Creates organizations, enables engines and limits, monitors the service. No default access to customer data.","prd":"§6","req":"IAM01","easy":"Veltrix staff who set up customer companies and switch engines on. They cannot see customer data by default.","tasks":["P1-03","P1-05"]},{"id":"r_orgadmin","label":"Organization administrator","group":"role","desc":"Manages users, sites, permissions and settings inside one organization; approves support access.","prd":"§6","req":"IAM01","easy":"The customer's administrator: adds users, sites and permissions.","tasks":["P1-03"]},{"id":"r_data","label":"Data steward","group":"role","desc":"Imports, maps columns, corrects and synchronizes data. Cannot approve plans without separate permission.","prd":"§6","req":"DAT01","easy":"Keeps the data clean: uploads files, fixes errors and publishes data.","tasks":["P1-03","P2-04"]},{"id":"r_planner","label":"Operations planner","group":"role","desc":"Configures scenarios, solves, edits and submits plans for authorized engines and sites.","prd":"§6","req":"","easy":"Creates and calculates plans and tries what-if scenarios.","tasks":["P1-03"]},{"id":"r_approver","label":"Approver","group":"role","desc":"Reviews, approves, rejects or revokes release before execution; documents reasons for overrides.","prd":"§6","req":"APR01","easy":"Reviews plans and approves or rejects them before they go to the floor.","tasks":["P1-03","P6-02"]},{"id":"r_exec","label":"Execution supervisor","group":"role","desc":"Records progress, downtime and exceptions. Cannot change formulations or baseline costs.","prd":"§6","req":"","easy":"Follows the work on the floor and records progress and breakdowns.","tasks":["P1-03","P7-03"]},{"id":"r_finance","label":"Analyst or finance manager","group":"role","desc":"Reviews indicators and baseline; approves financial impact and attribution.","prd":"§6, §20","req":"FIN01","easy":"Reviews results and signs off the money impact.","tasks":["P1-03","P9-01","P9-02"]},{"id":"r_support","label":"Authorized support user","group":"role","desc":"Diagnoses within an explicitly approved scope and time window. Access is logged and revocable.","prd":"§6, §28","req":"AUD01","easy":"Helps the customer for a limited time, and only with their permission.","tasks":["P1-03","P12-03"]},{"id":"t_cc","label":"Claude Code","group":"team","desc":"Lead engineer: architecture, tenancy, engines and formulations, lifecycle, outbox, finance logic, frontend foundation, security.","prd":"§29","req":"","easy":"The AI coding tool that leads the build: it designs the system and writes the engines.","tasks":["P0-01","P0-03","P1-01","P1-03","P2-04","P3-01","P4-01","P5-01","P5-02","P5-05","P6-01","P6-02","P7-01","P8-01","P9-02","P10-01","P10-05","P11-01","P11-05","P12-01","P13-01","P13-03","P14-01","P14-02","P14-05"]},{"id":"t_cx","label":"Codex","group":"team","desc":"Implementation engineer and independent checker: features, CI, tests, benchmarks, screens and every engine validator.","prd":"§29","req":"","easy":"The second AI coding tool: it builds features, tests and the independent checkers, and reviews Claude Code's work.","tasks":["P0-02","P0-05","P1-02","P1-04","P4-03","P5-03","P10-07","P13-04","P14-03"]},{"id":"t_or","label":"OR specialist","group":"team","desc":"Human owner of model correctness. Signs every formulation and engine PR.","prd":"§29","req":"","easy":"A human optimization expert who signs off the maths behind every engine.","tasks":["P5-01","P13-01","P14-01"]},{"id":"t_po","label":"Product owner","group":"team","desc":"Human owner of scope: ADRs, data dictionary, coverage register, release gates.","prd":"§29","req":"","easy":"The human who decides what the product does and what it promises customers.","tasks":["P3-02","P12-01","P12-04"]},{"id":"t_cust","label":"Customer operations and finance owners","group":"team","desc":"Sign rules, real plans, operational acceptance and benefit attribution.","prd":"§7, §27, §29","req":"","easy":"The customer's own managers, who confirm the plans work in real life and the savings are real.","tasks":["P9-02","P12-02","P12-04"]},{"id":"d_org","label":"Organization and site","group":"data","desc":"Code, name, type, currency and IANA time zone. The isolation boundary for every record.","prd":"§9","req":"TEN01","easy":"The customer company and its sites (factories, warehouses). Each company's data is completely separated from every other company.","tasks":["P1-01","P2-01"]},{"id":"d_product","label":"Product and units","group":"data","desc":"Code, base unit, explicit conversions, weight, volume, shelf life. Items and cases never mixed.","prd":"§9","req":"DAT03","easy":"Everything the customer makes or stocks, with its units. Converting pieces to cartons is always done on purpose, never guessed.","tasks":["P2-01","P2-02","P2-03"]},{"id":"d_order","label":"Order and order line","group":"data","desc":"Product, quantity, location, priority, due date, status. Positive quantities, valid references, deduplicated.","prd":"§9","req":"DAT02","easy":"What customers ordered: which product, how many and by when.","tasks":["P2-01"]},{"id":"d_partner","label":"Supplier and customer","group":"data","desc":"Location, lead times and planning terms, with personal data minimized.","prd":"§9, §24","req":"","easy":"Suppliers and customers, with only the details planning needs, such as delivery times.","tasks":["P2-01"]},{"id":"d_resource","label":"Operational resource","group":"data","desc":"Line, machine or vehicle with capacity, calendar and compatibility.","prd":"§9, §12, §13","req":"","easy":"The things that do the work: production lines, machines and trucks, with their capacity.","tasks":["P2-01","P2-02"]},{"id":"d_routing","label":"Product routing","group":"data","desc":"Operation sequence per product, eligible lines, processing rates, transfer times.","prd":"§12","req":"PRD01","easy":"The recipe for making a product: which steps, in which order and on which lines.","tasks":["P2-01"]},{"id":"d_calendar","label":"Calendar and shifts","group":"data","desc":"Shifts, breaks, maintenance and downtime in local workday terms.","prd":"§9, §12","req":"","easy":"When things are available: shifts, breaks, maintenance and stoppages.","tasks":["P2-01","P2-02","P2-03"]},{"id":"d_stock","label":"Inventory and batch","group":"data","desc":"Available, reserved and unreleased stock, quality status and expiry per product and location.","prd":"§9, §14","req":"INV01","easy":"How much of each product or material is available, reserved or waiting for quality release.","tasks":["P2-01","P14-02"]},{"id":"d_cost","label":"Cost","group":"data","desc":"Type, value, unit, currency and effective period. No cross-currency sums without a documented rate.","prd":"§9, §20","req":"","easy":"Prices and costs with a clear currency, such as overtime per hour or storage per pallet.","tasks":["P2-01","P2-03"]},{"id":"d_snapshot","label":"Data snapshot","group":"data","desc":"Immutable, time-specific copy of the inputs that produced a result.","prd":"§10, §17","req":"CFG01","easy":"A frozen photo of all the data used for one calculation, so anyone can later see exactly what a plan was based on.","tasks":["P0-04","P2-06"]},{"id":"d_event","label":"Execution event","group":"data","desc":"Identifier, occurrence and receipt time, source, quantity or status. Deduplicated; corrections are adjustments.","prd":"§9, §18","req":"INT01","easy":"A record of what really happened: a job finished, a machine broke down, a truck delivered.","tasks":["P2-01","P5-05","P7-03","P13-05"]},{"id":"f_tenant","label":"Tenant isolation","group":"found","desc":"Org scope from the session only, row-level security, org-prefixed files, caches, queues and logs.","prd":"§24","req":"TEN01","easy":"A wall between companies. One customer can never see another customer's data.","tasks":["P1-01","P11-01"]},{"id":"f_auth","label":"Authentication and MFA","group":"found","desc":"Invitations, sign-in, MFA for sensitive roles, throttling, session revocation.","prd":"§24","req":"IAM01","easy":"Secure sign-in with invitations, plus a second check (a code from a phone app) for important accounts.","tasks":["P1-02"]},{"id":"f_authz","label":"Role and site authorization","group":"found","desc":"Role × site × entitlement policy enforced on APIs, imports, exports and jobs.","prd":"§6","req":"IAM01","easy":"Decides who may do what, and at which site. The server checks it every single time.","tasks":["P1-03","P11-01"]},{"id":"f_audit","label":"Audit trail","group":"found","desc":"Append-only record of actor, action, time and version.","prd":"§6, §17","req":"AUD01","easy":"A permanent record of who did what, when, and on which plan version.","tasks":["P1-04","P12-03"]},{"id":"f_import","label":"Import pipeline","group":"found","desc":"Staging, column mapping, validation, difference preview, atomic publish, upsert by external id.","prd":"§10","req":"DAT01, DAT02","easy":"The front door for data. Files wait in a holding area, get checked, and only then replace the live data, all at once or not at all.","tasks":["P2-04","P10-03","P12-02"]},{"id":"f_valid","label":"Data validation rules","group":"found","desc":"Blocking errors and accepted warnings reported by row, field, value, issue and fix.","prd":"§10","req":"DAT01","easy":"Automatic checks on incoming data, such as a missing machine speed or a negative quantity. Serious problems block the upload; small ones need a written reason to accept.","tasks":["P2-04","P2-05"]},{"id":"f_sot","label":"Source-of-truth matrix","group":"found","desc":"Which system owns each entity or field, who edits it and how fresh it must be.","prd":"§10, §34","req":"","easy":"A rulebook saying which system owns each piece of data. Example: orders belong to the ERP, real progress belongs to the factory system.","tasks":["P0-04","P2-04"]},{"id":"f_units","label":"Units, currency and time","group":"found","desc":"Explicit unit conversions, money with currency, IANA time zones and local workdays.","prd":"§9","req":"DAT03","easy":"Makes sure units, money and time zones are handled correctly, for example 1 carton = 24 pieces, and shifts follow local time.","tasks":["P2-03"]},{"id":"f_config","label":"Objectives and constraints","group":"found","desc":"Versioned objectives (lexicographic or normalized weights) and hard or soft constraints.","prd":"§11","req":"CFG01","easy":"The planner's goals and rules, such as 'deliver on time first, then reduce cost' and 'line 3 cannot make product X'. Saved as versions.","tasks":["P3-01","P10-04"]},{"id":"f_template","label":"Industry templates","group":"found","desc":"Bundles of schemas, supported constraints, default objectives and reports per operating family.","prd":"§11","req":"","easy":"A ready-made starting setup for one type of business, for example batch manufacturing.","tasks":["P3-02"]},{"id":"f_coverage","label":"Coverage register","group":"found","desc":"Per template: engine, supported constraints, exclusions, tested sizes, last validation date.","prd":"§4, §30","req":"","easy":"An honest list of what each setup supports, what it does not, and how large a problem it was tested on.","tasks":["P3-02","P12-01"]},{"id":"f_entitle","label":"Engine entitlements","group":"found","desc":"Which engines and limits an organization bought; drives what the interface shows.","prd":"§5, §28","req":"","easy":"Which engines a customer has bought. Engines that are not bought or not ready are simply not shown.","tasks":["P1-05","P10-01","P11-05"]},{"id":"f_fresh","label":"Freshness and staleness","group":"found","desc":"Sync markers and thresholds; newer data marks plans stale and notifies.","prd":"§10","req":"APR01","easy":"Watches how up to date the data is. When newer data arrives, older plans are marked as out of date.","tasks":["P2-06","P6-02"]},{"id":"s_contract","label":"Solve contract","group":"solve","desc":"Request and result schemas: snapshot, rule version, horizon, objectives, locks, budget, statuses, bounds.","prd":"§23","req":"RUN02","easy":"The standard 'order form' for a calculation: which data, which rules and how long it may run.","tasks":["P4-02"]},{"id":"s_queue","label":"Solve job service","group":"solve","desc":"Durable background runs with per-organization limits, cancellation and crash recovery.","prd":"§22, §25","req":"RUN01","easy":"A waiting line where calculations run in the background. Closing the browser does not stop them, and no single company can take all the computing power.","tasks":["P0-03","P4-01","P11-02","P11-04"]},{"id":"s_profile","label":"Run profile","group":"solve","desc":"Time and memory limits, rounding, objective order, versions and seed per template.","prd":"§16","req":"","easy":"The limits for one calculation: maximum time, memory and rounding.","tasks":["P4-01","P4-02"]},{"id":"s_status","label":"Honest result statuses","group":"solve","desc":"Proven optimal, feasible, proven infeasible, inconclusive, failed or canceled.","prd":"§16","req":"RUN02","easy":"Tells the truth about the result: best possible, good but not proven best, impossible, or ran out of time.","tasks":["P0-04","P4-02","P8-01"]},{"id":"s_solver","label":"Solver libraries","group":"solve","desc":"OR-Tools CP-SAT, OR-Tools routing and a MILP solver chosen per problem and license.","prd":"§16, §22","req":"","easy":"The mathematical toolbox (Google OR-Tools and similar) that searches millions of options for the best plan.","tasks":["P0-03","P4-02","P5-02","P13-03","P14-02"]},{"id":"s_validator","label":"Independent validator","group":"solve","desc":"Recomputes every rule from inputs and plan without solver code. Hard violations block approval.","prd":"§27","req":"RUN03","easy":"A separate checker, built by a different team member, that re-checks every plan against every rule before anyone can approve it.","tasks":["P0-05","P4-03","P5-03","P5-04","P6-04","P13-04","P14-03"]},{"id":"e_prod","label":"Production engine","group":"engine","desc":"Batch scheduling on lines and shifts: compatibility, no overlap, precedence, changeovers, calendars, materials, due dates, frozen window.","prd":"§12","req":"PRD01, PRD02, PRD03","easy":"Builds the production schedule: which order runs on which line and when, respecting machines, shifts, materials and due dates.","tasks":["P5-01","P5-02","P5-03","P5-04","P5-05","P5-06","P10-05","P14-05"]},{"id":"e_trans","label":"Transportation engine","group":"engine","desc":"Routes from depots with capacities, time windows, breaks, road times and unserved penalties.","prd":"§13","req":"LOG01, LOG02, LOG03","easy":"Plans delivery routes: which truck takes which orders, in which sequence, within its capacity and the customers' delivery windows.","tasks":["P13-01","P13-02","P13-03","P13-04","P13-05","P13-06","P14-05"]},{"id":"e_inv","label":"Inventory engine","group":"engine","desc":"Time-phased purchase and transfer planning with lead times, pack multiples, budget and shelf life.","prd":"§14","req":"INV01, INV02, INV03","easy":"Suggests what to buy or move between warehouses and when, so there is enough stock without too much.","tasks":["P14-01","P14-02","P14-03","P14-04","P14-05"]},{"id":"e_orch","label":"Engine coordination","group":"engine","desc":"Passes approved outputs between engines with versions and loop safeguards. Sequencing, not joint optimization.","prd":"§15","req":"ORC01","easy":"Passes approved results from one engine to the next, for example production dates on to delivery planning.","tasks":["P14-05"]},{"id":"l_scenario","label":"Scenario","group":"life","desc":"A set of assumptions and inputs used for comparison: extra shift, changed due date, breakdown.","prd":"§17","req":"PLN01","easy":"A 'what if' copy of the plan, for example 'what if we add a Saturday shift?'","tasks":["P6-01","P6-03","P10-04"]},{"id":"l_version","label":"Plan version","group":"life","desc":"Immutable result of one snapshot, configuration and run. Edits create new versions.","prd":"§17","req":"PLN01","easy":"Each calculated plan is saved as a numbered version. Approved versions are never changed, only replaced by a newer one.","tasks":["P5-02","P6-01"]},{"id":"l_states","label":"Plan state machine","group":"life","desc":"Draft, calculated, review, submitted, approved, exported or released, in progress, completed or superseded.","prd":"§17","req":"PLN01","easy":"The life of a plan: draft, calculated, under review, approved, sent, in progress, completed.","tasks":["P0-04","P6-01"]},{"id":"l_compare","label":"Scenario comparison","group":"life","desc":"Cost, timing, utilization, changed decisions and unserved items on the same scope and units.","prd":"§17","req":"","easy":"Puts two plans side by side: cost, late orders, machine use and what changed.","tasks":["P6-03"]},{"id":"l_edit","label":"Manual edit and revalidation","group":"life","desc":"Drag or move, then server validation; hard violations cannot be saved.","prd":"§12","req":"RUN03","easy":"The planner can move a job by hand. The system re-checks it at once and refuses moves that break a rule.","tasks":["P6-04","P10-05"]},{"id":"l_locks","label":"Locks and frozen window","group":"life","desc":"Decisions protected from change during replanning: started work and commitments.","prd":"§12, §36","req":"PRD03","easy":"Decisions that must not change, such as a job that is already running on a machine.","tasks":["P5-05","P6-04","P10-05"]},{"id":"l_approval","label":"Approval","group":"life","desc":"Transactional check of feasibility, freshness, authority and conflicting versions.","prd":"§17","req":"APR01","easy":"A manager approves the plan. The system first checks that it is valid, up to date and not overtaken by another version.","tasks":["P4-03","P6-02","P7-02"]},{"id":"l_replan","label":"Replanning","group":"life","desc":"After breakdowns, cancellations or urgent orders, a new version that preserves completed and active work.","prd":"§18","req":"PRD03, LOG02","easy":"When something changes, makes a new plan that keeps finished and running work in place.","tasks":["P5-05","P13-05"]},{"id":"l_explain","label":"Explanation and diagnosis","group":"life","desc":"Facts, counterfactuals and inferences with evidence; infeasibility conflicts; relaxation as separate scenarios.","prd":"§19","req":"","easy":"Explains why: why an order is late, why no plan was possible, and what could fix it.","tasks":["P5-06","P8-01","P15-01"]},{"id":"o_export","label":"Plan export","group":"out","desc":"Approved plan as XLSX, CSV or PDF with identity, version, scope, currency and units.","prd":"§18, §21","req":"EXE01","easy":"Sends the approved plan out as Excel, CSV or PDF, clearly marked with its version number.","tasks":["P2-07","P7-02"]},{"id":"o_outbox","label":"Outbox and idempotency","group":"out","desc":"Submissions written with approval, retried safely, tracked as sent, accepted, failed or executed.","prd":"§23","req":"INT01","easy":"A safe sending queue: plans and orders go out exactly once, even if the connection drops and the system retries.","tasks":["P7-01","P14-04"]},{"id":"o_recon","label":"Reconciliation","group":"out","desc":"Periodic comparison with external systems and a manual review queue.","prd":"§23","req":"INT01","easy":"Regularly compares Veltrix with the other systems to catch anything that went out of step.","tasks":["P7-01"]},{"id":"o_api","label":"Integration API v1","group":"out","desc":"Import, status, export and events endpoints with scoped, rotatable keys.","prd":"§23","req":"INT01","easy":"A secure connection that other software uses to send data to Veltrix and collect approved plans automatically.","tasks":["P7-04"]},{"id":"o_monitor","label":"Execution monitoring","group":"out","desc":"Operation status, deviations and breakdowns from events; triggers replanning requests.","prd":"§18","req":"","easy":"Shows the plan next to reality as work happens, and points out differences.","tasks":["P7-03"]},{"id":"o_kpi","label":"KPI registry","group":"out","desc":"Every indicator with definition, formula, unit, period, source and owner; projected versus actual.","prd":"§20","req":"KPI01","easy":"The scorecard: on-time delivery, machine use, overtime and more, each with a clear definition.","tasks":["P5-06","P9-01","P12-02"]},{"id":"o_fin","label":"Financial impact and ROI","group":"out","desc":"Cash savings, margin, avoided costs, liquidity kept separate; ROI with zero-cost guard; payback from cash flows.","prd":"§20","req":"FIN01","easy":"Calculates the money impact honestly. Real savings are shown separately from cash freed from stock, and return on investment is only shown when costs are known.","tasks":["P9-02","P9-03"]},{"id":"o_report","label":"Reports","group":"out","desc":"Plan, exceptions, comparison, planned versus actual, financial impact, history.","prd":"§21","req":"","easy":"Ready-to-share reports: the plan, problems, comparisons, planned versus actual and money impact.","tasks":["P9-03","P10-06"]},{"id":"o_alert","label":"Alerts","group":"out","desc":"Deduplicated in-app and email alerts for data, stale plans, solve failures, approvals and disruptions.","prd":"§21","req":"","easy":"Messages in the app or by email: data problems, out-of-date plans, approvals waiting, breakdowns.","tasks":["P2-06","P9-04"]},{"id":"x_security","label":"Security and privacy","group":"ops","desc":"Threat model, cross-tenant tests, secrets, file safety, data minimization and deletion including backups.","prd":"§24","req":"TEN01","easy":"Protection against attacks and leaks, and careful handling of personal data.","tasks":["P1-01","P2-07","P11-01"]},{"id":"x_observe","label":"Observability","group":"ops","desc":"Logs without personal data, solve and queue metrics, traces, actionable alerts.","prd":"§22, §25","req":"OPS01","easy":"Dashboards and alarms that tell the technical team when something is slow or failing.","tasks":["P11-02","P11-03"]},{"id":"x_backup","label":"Backup and restore","group":"ops","desc":"Tested restoration, measured RPO and RTO, backup-failure alerts, outage fallback.","prd":"§25","req":"OPS01","easy":"Regular backups and practised restores, so data can be recovered after a problem.","tasks":["P11-03"]},{"id":"x_perf","label":"Performance and fairness","group":"ops","desc":"Pilot-load targets, solve benchmarks and per-organization fairness.","prd":"§25","req":"","easy":"Tests that screens stay fast and calculations stay within their time limits.","tasks":["P4-01","P5-04","P11-04"]},{"id":"x_deploy","label":"Deployment and environments","group":"ops","desc":"Repository, CI, infrastructure as code, gated engine releases and safe rollback.","prd":"§22, §27","req":"OPS01","easy":"How new versions are released safely, with a way to go back if needed.","tasks":["P0-01","P0-02","P0-03","P11-05"]},{"id":"x_support","label":"Support tooling","group":"ops","desc":"Support records by run id, time-bound access, sanitized diagnostics, change classification.","prd":"§28","req":"AUD01","easy":"Tools that let the support team help customers without seeing their private data.","tasks":["P12-03"]},{"id":"u_signin","label":"Sign in","group":"ui","desc":"Account, invitations, extra verification and recovery.","prd":"§8","req":"IAM01","easy":"Where users sign in, accept invitations and recover access.","tasks":["P1-02","P10-01","P10-02"]},{"id":"u_overview","label":"Operations overview","group":"ui","desc":"Latest plan, data issues, delays and solve status.","prd":"§8","req":"","easy":"The home page: latest plan, data problems, delays and calculation status.","tasks":["P9-04","P10-01","P10-02","P10-07"]},{"id":"u_datacenter","label":"Data center","group":"ui","desc":"Files, sources, validation status and column mapping; publish a data version.","prd":"§8","req":"DAT01","easy":"Where data is uploaded, checked and published.","tasks":["P2-04","P2-05","P10-03"]},{"id":"u_master","label":"Master data","group":"ui","desc":"Products, locations, resources, calendars and costs with effective dates.","prd":"§8","req":"","easy":"Where products, sites, machines, calendars and costs are edited.","tasks":["P2-02","P10-03"]},{"id":"u_engcfg","label":"Engine configuration","group":"ui","desc":"Objectives, constraints, policies and solve limits; save and validate versions.","prd":"§8","req":"CFG01","easy":"Where the goals and rules for each engine are set.","tasks":["P3-01","P10-04"]},{"id":"u_workspace","label":"Planning workspace","group":"ui","desc":"Horizon, scope, inputs and scenarios; create, duplicate, solve and compare.","prd":"§8","req":"","easy":"Where plans and what-if scenarios are created, calculated and compared.","tasks":["P6-03","P10-04"]},{"id":"u_prodres","label":"Production results","group":"ui","desc":"Line Gantt, operations, conflicts and indicators; lock, edit and revalidate.","prd":"§8","req":"PRD01","easy":"The production schedule chart, where jobs can be locked or moved.","tasks":["P5-06","P10-05","P10-07"]},{"id":"u_transres","label":"Transportation results","group":"ui","desc":"Map, routes, stops and loads; edit, lock and revalidate.","prd":"§8","req":"LOG01","easy":"The delivery map with routes, stops and truck loads.","tasks":["P13-06"]},{"id":"u_invres","label":"Inventory results","group":"ui","desc":"Purchase and transfer proposals and stock risks; submit for approval.","prd":"§8","req":"INV02","easy":"Buying and transfer suggestions, with stock risks.","tasks":["P14-04"]},{"id":"u_approvals","label":"Approvals","group":"ui","desc":"Submitted versions, differences and comments; approve, reject or request changes.","prd":"§8","req":"APR01","easy":"Where managers approve, reject or ask for changes.","tasks":["P10-06"]},{"id":"u_execmon","label":"Execution monitoring","group":"ui","desc":"Work status, deviations and breakdowns; record events and request replanning.","prd":"§8","req":"","easy":"Where progress on the floor is followed and breakdowns are recorded.","tasks":["P10-06"]},{"id":"u_impact","label":"Impact and reports","group":"ui","desc":"Baseline, planned and actual results with finance sign-off; compare and export.","prd":"§8","req":"KPI01","easy":"Where results and money impact are compared and reported.","tasks":["P9-01","P9-03","P10-06"]},{"id":"u_admin","label":"Administration and integration","group":"ui","desc":"Users, engines, credentials and synchronization.","prd":"§8","req":"","easy":"Where users, permissions and connections to other systems are managed.","tasks":["P1-05","P7-04","P10-02"]},{"id":"rel_r1","label":"Release 1","group":"release","desc":"Shared foundation plus the production engine for a validated batch pattern.","prd":"§5, §30","req":"","easy":"First release: the base platform plus production planning.","tasks":["P12-01","P12-04"]},{"id":"rel_r2","label":"Release 2","group":"release","desc":"Standalone transportation engine with controlled integration.","prd":"§5","req":"","easy":"Second release: delivery route planning.","tasks":["P13-03"]},{"id":"rel_r3","label":"Release 3","group":"release","desc":"Inventory and replenishment engine with coordinated decision flows.","prd":"§5","req":"","easy":"Third release: stock planning and linking the engines together.","tasks":["P14-02"]},{"id":"rel_ext","label":"Extensions","group":"release","desc":"Explanation assistant and other deferred capabilities, only when need and value are proven.","prd":"§5, §32","req":"AI01","easy":"Later extras, such as a chat assistant, only once they are proven useful.","tasks":["P15-01"]}],"edges":[{"s":"files","t":"f_import","label":"uploads"},{"s":"erp","t":"f_import","label":"orders and master data"},{"s":"erp","t":"f_sot","label":"owns orders"},{"s":"mes","t":"d_event","label":"sends events"},{"s":"mes","t":"f_sot","label":"owns actual status"},{"s":"wms","t":"d_stock","label":"stock positions"},{"s":"maps","t":"e_trans","label":"tr ltrix Operations Optimization Platform monorepo.\nBefore writing code, read CLAUDE.md, the PRD sections listed below in docs/prd/, docs/adr/ and docs/data-dictionary/. Restate the task in 5 to 10 bullets, list assumptions and open questions, propose a file-level plan, then write the acceptance tests first.\n\nTASK P0-01: Repository scaffold and engineering conventions\nPRD: §22, §29, §34   Requirements: -   Depends on: -\n\nCONTEXT\nGreenfield repository. PRD §22 proposes a modular application: one logical backend, one relational database, long-running calculations in background workers, and a Vue + TypeScript web interface. Dozens of microservices are explicitly not wanted.\n\nBUILD\n1. Create the monorepo layout: apps/api (FastAPI), apps/worker, apps/web (Vue 3 + TypeScript + Vite), packages/core, packages/contracts, packages/engines/{production,transportation,inventory}, packages/validators, docs/{prd,adr,tasks,data-dictionary,state-machines,engines,runbooks}, tests/{reference-cases,e2e,security,performance}, infra/.\n2. Python 3.12 workspace (uv or Poetry) with ruff, mypy --strict, pytest, pytest-cov, hypothesis and import-linter configured at the root.\n3. packages/core with settings (pydantic-settings), UUIDv7 ids, structured JSON logging with request id, a base error type mapped to RFC 7807 problem responses.\n4. apps/web with Vue 3, TypeScript strict, Pinia, vue-router, vue-i18n, Vitest, Playwright, ESLint and Prettier.\n5. docker-compose for local development: postgres:16, api, worker, web, mailpit, minio. Makefile targets: dev, test, lint, typecheck, migrate, bench.\n6. Commit CLAUDE.md and AGENTS.md from the plan at the repository root, a PR template with a traceability table (task id, PRD section, requirement id, test name), and CODEOWNERS routing packages/engines/** to the OR specialist.\n7. Health endpoints /healthz (process) and /readyz (database and queue reachable).\n\nNON-NEGOTIABLES\n- No feature code in this task.\n- Pin every dependency and record its license in docs/adr/licenses.md.\n- .env.example contains placeholders only.\n- Organization scope comes from the session or API key only; permissions are enforced on the server; every mutating action writes an audit event.\n- No secrets or personal data in code, fixtures, logs or messages. User-facing text exists in Arabic and English.\n\nACCEPTANCE (automated tests; name requirement tests test_<REQ-ID>_<behaviour>)\n- `make dev` starts all services on a clean machine and /readyz returns 200.\n- `make test` runs at least one passing test in every Python package and in apps/web.\n- `make lint` and `make typecheck` pass with zero warnings.\n- gitleaks finds no secrets.\n- PR template and CODEOWNERS exist.\n\nOUT OF SCOPE\nCI workflows (P0-02), authentication, any business feature.\n\nHANDOFF\nWork on branch feat/p0-01-repository-scaffold-and-engineering-conventions. Run make lint, make typecheck and make test. Open a PR whose description contains: summary, design decisions, a traceability table (task, PRD section, requirement id, test name), commands run with results, known limitations, and questions for the reviewer. Do not report the task as done if any acceptance test is missing, skipped or failing.","review":"You are Codex, reviewing the pull request for TASK P0-01: Repository scaffold and engineering conventions. Claude Code wrote this code; you did not. Review it independently.\n1. Read docs/tasks/P0-01.md, PRD §22, §29, §34 and the full diff.\n2. Check that every acceptance criterion has a test that would fail if the behaviour broke. Run make test and the task's tests yourself.\n3. Focus for this task: Folder layout matches the plan, no premature microservices, pinned dependencies with acceptable licenses, no secrets in .env.example.\n4. Always check: organization isolation (add a cross-tenant test if one is missing), server-side authorization, audit events, idempotency, reversible migrations, Arabic and English strings, actionable errors, no secrets or personal data, no unlabeled mock data, no import from engines into validators.\n5. Reply with: verdict (approve or request changes); blocking issues with file:line, why it matters (cite the PRD) and a concrete fix; non-blocking suggestions; missing tests (write small ones directly). Do not rewrite the feature."},{"id":"P0-02","title":"CI pipeline and quality gates","owner":"CX","phase":"P0","phaseName":"Foundations and engineering system","prd":"§27, §29","req":"-","deps":"P0-01","gate":"","nodes":["x_deploy","t_cx"],"build":"You are Codex, acting as implementation engineer on the Veltrix Operations Optimization Platform monorepo.\nBefore writing code, read AGENTS.md, the PRD sections listed below in docs/prd/, docs/adr/ and docs/data-dictionary/. Restate the task in 5 to 10 bullets, list assumptions and open questions, propose a file-level plan, then write the acceptance tests first.\n\nTASK P0-02: CI pipeline and quality gates\nPRD: §27, §29   Requirements: -   Depends on: P0-01\n\nCONTEXT\nBoth agents open PRs. Every PR must pass the same automated gates so quality does not depend on which agent wrote the code.\n\nBUILD\n1. GitHub Actions workflow on pull_request: ruff, eslint, mypy, vue-tsc, pytest with coverage (fail when coverage of changed lines in apps/ and packages/ is below 80%), Vitest.\n2. Migration job: start an empty Postgres, run alembic upgrade head, downgrade base, upgrade head again.\n3. OpenAPI job: generate the schema, diff it against main and post the diff as a PR comment; fail on breaking changes unless the PR has the label api-breaking.\n4. Security jobs: gitleaks, pip-audit, npm audit (fail on high), license allowlist check.\n5. import-linter job enforcing: packages/validators must not import packages/engines; apps/web never imports server code.\n6. Playwright smoke job (placeholder test) and Docker image build for api, worker and web.\n7. Nightly workflow placeholder for `make bench` that uploads benchmark artifacts.\n8. Document the required status checks in docs/runbooks/ci.md.\n\nNON-NEGOTIABLES\n- Workflows use `permissions:` with the minimum needed.\n- No deployment secrets in this repository.\n- Every failing gate must block merge.\n- Organization scope comes from the session or API key only; permissions are enforced on the server; every mutating action writes an audit event.\n- No secrets or personal data in code, fixtures, logs or messages. User-facing text exists in Arabic and English.\n\nACCEPTANCE (automated tests; name requirement tests test_<REQ-ID>_<behaviour>)\n- A test branch with a lint error, a type error, a failing test, a fake secret and a forbidden import is blocked by the matching job (attach screenshots or logs).\n- Migration up/down/up runs on every PR.\n- OpenAPI diff is posted.\n- Full CI on the scaffold finishes in under 15 minutes.\n\nOUT OF SCOPE\nProduction deployment (P11-05).\n\nHANDOFF\nWork on branch feat/p0-02-ci-pipeline-and-quality-gates. Run make lint, make typecheck and make test. Open a PR whose description contains: summary, design decisions, a traceability table (task, PRD section, requirement id, test name), commands run with results, known limitations, and questions for the reviewer. Do not report the task as done if any acceptance test is missing, skipped or failing.","review":"You are Claude Code, reviewing the pull request for TASK P0-02: CI pipeline and quality gates. Codex wrote this code; you did not. Review it independently.\n1. Read docs/tasks/P0-02.md, PRD §27, §29 and the full diff.\n2. Check that every acceptance criterion has a test that would fail if the behaviour broke. Run make test and the task's tests yourself.\n3. Focus for this task: Every gate actually blocks merge, least-privilege workflow permissions, no credentials, reasonable run time.\n4. Always check: organization isolation (add a cross-tenant test if one is missing), server-side authorization, audit events, idempotency, reversible migrations, Arabic and English strings, actionable errors, no secrets or personal data, no unlabeled mock data, no import from engines into validators.\n5. Reply with: verdict (approve or request changes); blocking issues with file:line, why it matters (cite the PRD) and a concrete fix; non-blocking suggestions; missing tests (write small ones directly). Do not rewrite the feature."},{"id":"P0-03","title":"Architecture decisions and technical spike","owner":"CC","phase":"P0","phaseName":"Foundations and engineering system","prd":"§16, §22, §24, §25","req":"-","deps":"P0-01","gate":"Tech lead and product owner approve the ADRs.","nodes":["s_solver","s_queue","x_deploy","t_cc"],"build":"You are Claude Code, acting as lead engineer on the Veltrix Operations Optimization Platform monorepo.\nBefore writing code, read CLAUDE.md, the PRD sections listed below in docs/prd/, docs/adr/ and docs/data-dictionary/. Restate the task in 5 to 10 bullets, list assumptions and open questions, propose a file-level plan, then write the acceptance tests first.\n\nTASK P0-03: Architecture decisions and technical spike\nPRD: §16, §22, §24, §25   Requirements: -   Depends on: P0-01\n\nCONTEXT\nPRD §22: do not adopt a language or library merely because the document names it; confirm versions, licenses and support through a small technical assessment.\n\nBUILD\n1. Write ADRs in docs/adr/ (MADR format): ADR-001 modular monolith; ADR-002 job queue (compare a Postgres SKIP LOCKED queue such as procrastinate against Redis with Dramatiq or Celery on durability, cancellation, deduplication and per-organization limits); ADR-003 authentication (built-in argon2id + TOTP versus an OIDC provider such as Keycloak); ADR-004 tenant isolation (application scoping plus Postgres row-level security); ADR-005 solver stack (CP-SAT for scheduling, OR-Tools routing, MILP through HiGHS or SCIP) with license review; ADR-006 private S3-compatible file storage; ADR-007 hosting environment with open questions for the Jordan data protection review (§24).\n2. Spike in /spikes/solve: a worker process solves a 20-job CP-SAT scheduling toy with a time limit, streams incumbents, supports cancellation mid-solve and records solver version, parameters and seed.\n3. Map solver outcomes to the five PRD result statuses: proven optimal, feasible, proven infeasible, inconclusive, failed or canceled.\n4. Measure solve time, peak memory and cancellation latency and record them in ADR-005.\n\nNON-NEGOTIABLES\n- Spike code is never imported by product code.\n- Each ADR states alternatives, decision, consequences and the trigger to revisit it.\n- A timeout without a solution maps to inconclusive, never to infeasible.\n- Organization scope comes from the session or API key only; permissions are enforced on the server; every mutating action writes an audit event.\n- No secrets or personal data in code, fixtures, logs or messages. User-facing text exists in Arabic and English.\n\nACCEPTANCE (automated tests; name requirement tests test_<REQ-ID>_<behaviour>)\n- Seven ADRs merged with human approval recorded.\n- Spike demonstrates all five status mappings, including a cancel within 2 seconds.\n- Measurements recorded in ADR-005.\n\nOUT OF SCOPE\nThe production engine itself (P5).\n\nHANDOFF\nWork on branch feat/p0-03-architecture-decisions-and-technical-spike. Run make lint, make typecheck and make test. Open a PR whose description contains: summary, design decisions, a traceability table (task, PRD section, requirement id, test name), commands run with results, known limitations, and questions for the reviewer. Do not report the task as done if any acceptance test is missing, skipped or failing.","review":"You are Codex, reviewing the pull request for TASK P0-03: Architecture decisions and technical spike. Claude Code wrote this code; you did not. Review it independently.\n1. Read docs/tasks/P0-03.md, PRD §16, §22, §24, §25 and the full diff.\n2. Check that every acceptance criterion has a test that would fail if the behaviour broke. Run make test and the task's tests yourself.\n3. Focus for this task: ADRs list real alternatives and consequences; the spike proves cancellation and honest status mapping; spike code is isolated.\n4. Always check: organization isolation (add a cross-tenant test if one is missing), server-side authorization, audit events, idempotency, reversible migrations, Arabic and English strings, actionable errors, no secrets or personal data, no unlabeled mock data, no import from engines into validators.\n5. Reply with: verdict (approve or request changes); blocking issues with file:line, why it matters (cite the PRD) and a concrete fix; non-blocking suggestions; missing tests (write small ones directly). Do not rewrite the feature."},{"id":"P0-04","title":"Data dictionary, source-of-truth matrix and state machines","owner":"CC","phase":"P0","phaseName":"Foundations and engineering system","prd":"§9, §10, §17, §34, §36","req":"-","deps":"P0-01","gate":"Product owner signs the data dictionary and SoT matrix.","nodes":["f_sot","l_states","s_status","d_snapshot"],"build":"You are Claude Code, acting as lead engineer on the Veltrix Operations Optimization Platform monorepo.\nBefore writing code, read CLAUDE.md, the PRD sections listed below in docs/prd/, docs/adr/ and docs/data-dictionary/. Restate the task in 5 to 10 bullets, list assumptions and open questions, propose a file-level plan, then write the acceptance tests first.\n\nTASK P0-04: Data dictionary, source-of-truth matrix and state machines\nPRD: §9, §10, §17, §34, §36   Requirements: -   Depends on: P0-01\n\nCONTEXT\nPRD §34 requires a data dictionary, source-of-truth matrix, rule versions, solve and plan state definitions and reference cases before scaling. These files become the contract every other task obeys.\n\nBUILD\n1. docs/data-dictionary/*.yaml: every entity from §9 with fields, types, units, precision, required flags, effective dating, external identifier rules and the engines that read it.\n2. docs/sot-matrix.yaml: for each entity or field, the source of truth (ERP, platform, execution system), editing owner, synchronization direction and default freshness threshold (§10).\n3. docs/state-machines/solve.yaml: queued → running → succeeded | time_limit | failed | canceled.\n4. docs/state-machines/result-status.yaml: proven_optimal, feasible, proven_infeasible, inconclusive, failed_or_canceled, each with interface behaviour from §16.\n5. docs/state-machines/plan.yaml: draft → calculated → in_review → submitted → approved → exported | released → in_progress → completed | superseded, plus rejected; each transition lists guard conditions and allowed roles.\n6. A generator in packages/contracts that produces Python enums and TypeScript types from the YAML, run in CI so code cannot drift.\n7. docs/glossary.md from PRD §36.\n\nNON-NEGOTIABLES\n- Solve states and plan states are separate machines (§17).\n- No state name may exist in code that is not in the YAML.\n- Organization scope comes from the session or API key only; permissions are enforced on the server; every mutating action writes an audit event.\n- No secrets or personal data in code, fixtures, logs or messages. User-facing text exists in Arabic and English.\n\nACCEPTANCE (automated tests; name requirement tests test_<REQ-ID>_<behaviour>)\n- Schema lint validates every YAML file.\n- Generated enums compile in Python and TypeScript.\n- A transition test enumerates every allowed and every forbidden transition.\n- Product owner sign-off recorded in the PR.\n\nOUT OF SCOPE\nDatabase models (P2-01).\n\nHANDOFF\nWork on branch feat/p0-04-data-dictionary-source-of-truth. Run make lint, make typecheck and make test. Open a PR whose description contains: summary, design decisions, a traceability table (task, PRD section, requirement id, test name), commands run with results, known limitations, and questions for the reviewer. Do not report the task as done if any acceptance test is missing, skipped or failing.","review":"You are Codex, reviewing lling (not in scope, §28).\n\nHANDOFF\nWork on branch feat/p9-02-financial-impact-and-roi. Run make lint, make typecheck and make test. Open a PR whose description contains: summary, design decisions, a traceability table (task, PRD section, requirement id, test name), commands run with results, known limitations, and questions for the reviewer. Do not report the task as done if any acceptance test is missing, skipped or failing.","review":"You are Codex, reviewing the pull request for TASK P9-02: Financial impact and ROI. Claude Code wrote this code; you did not. Review it independently.\n1. Read docs/tasks/P9-02.md, PRD §20 and the full diff.\n2. Check that every acceptance criterion has a test that would fail if the behaviour broke. Run make test and the task's tests yourself.\n3. Focus for this task: Exact ROI formula, zero-cost guard, liquidity separated from profit, no double deduction, payback from timed flows.\n4. Always check: organization isolation (add a cross-tenant test if one is missing), server-side authorization, audit events, idempotency, reversible migrations, Arabic and English strings, actionable errors, no secrets or personal data, no unlabeled mock data, no import from engines into validators.\n5. Reply with: verdict (approve or request changes); blocking issues with file:line, why it matters (cite the PRD) and a concrete fix; non-blocking suggestions; missing tests (write small ones directly). Do not rewrite the feature."},{"id":"P9-03","title":"Reports and exports","owner":"CX","phase":"P9","phaseName":"Indicators, finance, reports and alerts","prd":"§21","req":"EXE01, FIN01","deps":"P6-03, P9-02, P2-07","gate":"","nodes":["o_report","u_impact","o_fin"],"build":"You are Codex, acting as implementation engineer on the Veltrix Operations Optimization Platform monorepo.\nBefore writing code, read AGENTS.md, the PRD sections listed below in docs/prd/, docs/adr/ and docs/data-dictionary/. Restate the task in 5 to 10 bullets, list assumptions and o function drawWires(){
  const net = document.getElementById("net"), svg = document.getElementById("wires"), core = document.getElementById("core");
  if (!net || !svg || getComputedStyle(svg).display === "none") return;
  const nb = net.getBoundingClientRect(), cb = core.getBoundingClientRect();
  const cy = cb.top + cb.height / 2 - nb.top;
  let p = "";
  net.querySelectorAll(".col.in .node").forEach(el => {
    const b = el.getBoundingClientRect(), x1 = b.right - nb.left, y1 = b.top + b.height / 2 - nb.top, x2 = cb.left - nb.left, mx = (x1 + x2) / 2;
    p += `<path d="M${x1},${y1}C${mx},${y1} ${mx},${cy} ${x2},${cy}" stroke="${home[el.dataset.id].color}"/>`;
  });
  net.querySelectorAll(".col.out .node").forEach(el => {
    const b = el.getBoundingClientRect(), x1 = cb.right - nb.left, x2 = b.left - nb.left, y2 = b.top + b.height / 2 - nb.top, mx = (x1 + x2) / 2;
    p += `<path d="M${x1},${cy}C${mx},${cy} ${mx},${y2} ${x2},${y2}" stroke="${home[el.dataset.id].color}"/>`;
  });
  svg.innerHTML = p;
}
window.addEventListener("resize", () => requestAnimationFrame(drawWires));
