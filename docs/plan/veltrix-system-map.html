  <div class="pager">
    ${i > 1 ? `<button class="btn" onclick="go('#/tour/${i - 1}')"><span><small>Back</small>${esc(T[i - 2].title)}</span></button>` : `<button class="btn" onclick="endTour()"><span><small>Leave the tour</small>Overview</span></button>`}
    ${i < T.length ? `<button class="btn primary" onclick="go('#/tour/${i + 1}')"><span><small style="color:inherit;opacity:.85">Next</small>${esc(T[i].title)}</span></button>` : `<button class="btn primary" onclick="endTour()"><span><small style="color:inherit;opacity:.85">Tour complete</small>Explore the eight steps</span></button>`}
  </div>`;
}
function endTour(){ tourIndex = null; go("#/"); }

function route(){
  const parts = location.hash.replace(/^#\/?/, "").split("/");
  const [kind, arg] = parts;
  if (kind !== "tour" && kind !== "part" && kind !== "task") tourIndex = null;
  view.classList.remove("wide");
  if (kind === "step") stepView(+arg);
  else if (kind === "group") groupView(arg);
  else if (kind === "part") partView(arg);
  else if (kind === "task") taskView(arg);
  else if (kind === "tour") tourView(+arg || 1);
  else if (kind === "map") mapView();
  else homeView();
  window.scrollTo(0, 0);
  view.focus({preventScroll: true});
}
document.addEventListener("keydown", e => {
  if (e.target.matches("input")) return;
  const m = location.hash.match(/^#\/tour\/(\d+)/);
  if (!m) return;
  if (e.key === "ArrowRight" && +m[1] < D.tour.length) go(`#/tour/${+m[1] + 1}`);
  if (e.key === "ArrowLeft" && +m[1] > 1) go(`#/tour/${+m[1] - 1}`);
});

// ---------- search ----------
const q = document.getElementById("q"), res = document.getElementById("res");
let hits = [], act = 0;
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  if (!s){ res.style.display = "none"; return; }
  const nh = D.nodes.filter(n => (n.label + " " + n.easy).toLowerCase().includes(s))
    .sort((a, b) => b.label.toLowerCase().startsWith(s) - a.label.toLowerCase().startsWith(s)).slice(0, 8)
    .map(n => ({h: `#/part/${n.id}`, html: `<i class="dot" style="--c:${home[n.id].color}"></i>${esc(n.label)}<small>${esc(home[n.id].kind === "step" ? "Step " + home[n.id].key : home[n.id].title)}</small>`}));
  const sh = D.steps.filter(x => x.title.toLowerCase().includes(s)).map(x => ({h: `#/step/${x.n}`, html: `<b>${x.n}</b>${esc(x.title)}<small>Step</small>`}));
  const th = D.tasks.filter(t => (t.id + " " + t.title).toLowerCase().includes(s)).slice(0, 6)
    .map(t => ({h: `#/task/${t.id}`, html: `<b>${t.id}</b>${esc(t.title)}<small>Task</small>`}));
  hits = [...sh, ...nh, ...th]; act = 0;
  res.innerHTML = hits.length ? hits.map((x, i) => `<button role="option" data-i="${i}">${x.html}</button>`).join("") : `<button disabled>No match. Try "engine", "approval" or a task like P5-02.</button>`;
  res.style.display = "block"; paint();
  res.querySelectorAll("[data-i]").forEach(b => b.onclick = () => pick(+b.dataset.i));
});
function paint(){ res.querySelectorAll("[data-i]").forEach((b, i) => b.classList.toggle("act", i === act)); }
function pick(i){ if (!hits[i]) return; res.style.display = "none"; q.value = ""; q.blur(); go(hits[i].h); }
q.addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ act = Math.min(hits.length - 1, act + 1); paint(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ act = Math.max(0, act - 1); paint(); e.preventDefault(); }
  else if (e.key === "Enter") pick(act);
  else if (e.key === "Escape") res.style.display = "none";
});
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.style.display = "none"; });

// ---------- mind map ----------
let mmOpen = new Set(), mmSel = null, mmAll = false;
const MMB = [
  ...D.steps.map(s => ({id: "s" + s.n, side: 1, num: s.n, title: s.title, q: s.q, text: s.text, color: s.color, parts: s.parts, link: "#/step/" + s.n})),
  ...D.around.map(g => ({id: "g" + g.id, side: -1, title: g.title, q: g.q, text: g.text, color: g.color, parts: g.parts, link: "#/group/" + g.id})),
];
const branchOfPart = {};
MMB.forEach(b => b.parts.forEach(p => branchOfPart[p] = b));
const reducedMM = matchMedia("(prefers-reduced-motion: reduce)").matches;

function mapView(){
  setRail(null); setNav("map"); view.classList.add("wide");
  view.innerHTML = `<div class="mm" id="mm">
    <div class="mmstage" id="mmstage"><svg id="mmsvg" role="img" aria-label="Mind map of the Veltrix platform"></svg>
      <div class="mmtools">
        <button class="btn" id="mmOpen">Open all</button>
        <button class="btn" id="mmClose">Close all</button>
        <button class="btn" id="mmLinks" aria-pressed="false">Show <span class="wo">all </span>connections</button>
        <button class="btn" id="mmFit">Fit<span class="wo"> to screen</span></button>
      </div>
      <div class="mmhint">Tap a coloured branch to open it. Tap any part to light up what it connects to. Drag to move; pinch or scroll to zoom.</div>
    </div>
    <aside class="mmpanel" id="mmpanel" aria-live="polite"></aside></div>`;
  buildMap();
}

function buildMap(){
  const mm = document.getElementById("mm");
  const sizeIt = () => { if (document.getElementById("mm")) mm.style.height = (innerHeight - document.querySelector(".top").offsetHeight) + "px"; };
  sizeIt();
  const svg = d3.select("#mmsvg");
  const zroot = svg.append("g");
  const gLinks = zroot.append("g"), gSyn = zroot.append("g"), gPulse = zroot.append("g"), gNodes = zroot.append("g");
  const ctx = document.createElement("canvas").getContext("2d");
  const fam = getComputedStyle(document.body).fontFamily;
  const tw = (t, f) => { ctx.font = f + " " + fam; return ctx.measureText(t).width; };
  const narrowMM = innerWidth <= 720;
  MMB.forEach(b => { b.side = narrowMM ? 1 : (b.num ? 1 : -1); });
  MMB.forEach(b => { b.label = b.num ? `${b.num}  ${b.title}` : b.title; b.w = tw(b.label, "700 14px") + 32; });
  const BX = narrowMM ? 90 : 150, ROWH = 28, BMIN = 58, GAP = 14;
  const LX = BX + Math.max(...MMB.map(b => b.w)) + 90;
  let leaves = [];
  const leafById = () => new Map(leaves.map(l => [l.id, l]));

  function layout(){
    leaves = [];
    [1, -1].forEach(side => {
      const bs = MMB.filter(b => b.side === side);
      const hs = bs.map(b => mmOpen.has(b.id) ? Math.max(b.parts.length * ROWH, BMIN) : BMIN);
      let y = -(d3.sum(hs) + GAP * (bs.length - 1)) / 2;
      bs.forEach((b, i) => {
        b.y = y + hs[i] / 2; b.x = side * BX; b.ox = side * (BX + b.w); b.cx = side * (BX + b.w / 2);
        if (mmOpen.has(b.id)) b.parts.forEach((p, j) => leaves.push({id: p, b, x: side * LX, y: y + ROWH / 2 + j * ROWH}));
        y += hs[i] + GAP;
      });
    });
  }
  const rootPath = b => `M0,0C${b.side * BX * .55},0 ${b.side * BX * .45},${b.y} ${b.x},${b.y}`;
  const leafPath = l => { const mx = (l.b.ox + l.x) / 2; return `M${l.b.ox},${l.b.y}C${mx},${l.b.y} ${mx},${l.y} ${l.x},${l.y}`; };
  const collapsedLeafPath = l => `M${l.b.ox},${l.b.y}C${l.b.ox},${l.b.y} ${l.b.ox},${l.b.y} ${l.b.ox},${l.b.y}`;

  // root
  const rootG = gNodes.append("g").attr("class", "mnode root").attr("tabindex", 0).attr("role", "button").attr("aria-label", "Veltrix platform overview");
  rootG.append("circle").attr("r", 62).attr("class", "halo").attr("fill", "var(--accent)");
  rootG.append("circle").attr("r", 46).attr("fill", "var(--ink)");
  rootG.append("text").attr("text-anchor", "middle").attr("dy", "-0.1em").style("fill", "var(--bg)").style("stroke", "none").style("font-weight", 700).style("font-size", "17px").text("Veltrix");
  rootG.append("text").attr("text-anchor", "middle").attr("dy", "1.25em").style("fill", "var(--bg)").style("stroke", "none").style("font-size", "11.5px").style("opacity", .8).text("platform");
  rootG.on("click", ev => { ev.stopPropagation(); mmSel = null; paint(); drawSyn(); panelRoot(); })
       .on("keydown", ev => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); rootG.dispatch("click"); } });

  const dur = reducedMM ? 0 : 450;

  function render(){
    layout();
    const t = d3.transition().duration(dur);
    // root links
    gLinks.selectAll("path.rl").data(MMB, b => b.id).join(e => e.append("path").attr("class", "lk rl").attr("stroke", b => b.color).attr("stroke-width", 4).attr("d", rootPath))
      .transition(t).attr("d", rootPath);
    // leaf links
    gLinks.selectAll("path.ll").data(leaves, l => l.id).join(
      e => e.append("path").attr("class", "lk ll").attr("stroke", l => l.b.color).attr("stroke-width", 2).attr("opacity", .75).attr("d", collapsedLeafPath).call(s => s.transition(t).attr("d", leafPath)),
      u => u.call(s => s.transition(t).attr("d", leafPath)),
      x => x.call(s => s.transition(t).attr("d", collapsedLeafPath).remove()));
    // branches
    const bj = gNodes.selectAll("g.branch").data(MMB, b => b.id).join(e => {
      const g = e.append("g").attr("class", "mnode branch").attr("tabindex", 0).attr("role", "button")
        .attr("aria-label", b => `${b.title}, ${b.parts.length} parts. Press Enter to open or close.`);
      g.append("rect").attr("rx", 17).attr("height", 34).attr("y", -17).attr("width", b => b.w).attr("x", b => b.side > 0 ? 0 : -b.w).attr("fill", b => b.color);
      g.append("text").attr("x", b => b.side > 0 ? 16 : -b.w + 16).attr("dy", "0.35em").text(b => b.label);
      g.append("text").attr("class", "cnt").attr("x", b => b.side > 0 ? 4 : -b.w + 4).attr("y", 32).text(b => `${b.parts.length} parts`);
      g.on("click", (ev, b) => { ev.stopPropagation(); toggleBranch(b); })
       .on("keydown", (ev, b) => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); toggleBranch(b); } });
      g.attr("transform", b => `translate(${b.x},${b.y})`);
      return g;
    });
    bj.transition(t).attr("transform", b => `translate(${b.x},${b.y})`);
    bj.select(".cnt").text(b => mmOpen.has(b.id) ? "" : `${b.parts.length} parts`);
    // leaves
    gNodes.selectAll("g.leaf").data(leaves, l => l.id).join(
      e => {
        const g = e.append("g").attr("class", "mnode leaf").attr("tabindex", 0).attr("role", "button")
          .attr("aria-label", l => byId.get(l.id).label).attr("opacity", 0)
          .attr("transform", l => `translate(${l.b.ox},${l.b.y})`);
        g.append("circle").attr("r", 7).attr("fill", l => l.b.color);
        g.append("text").attr("x", l => l.b.side > 0 ? 13 : -13).attr("text-anchor", l => l.b.side > 0 ? "start" : "end").attr("dy", "0.35em").text(l => byId.get(l.id).label);
        g.on("click", (ev, l) => { ev.stopPropagation(); selectPart(l.id, false); })
         .on("keydown", (ev, l) => { if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); selectPart(l.id, false); } });
        g.transition(t).attr("opacity", 1).attr("transform", l => `translate(${l.x},${l.y})`);
        return g;
      },
      u => u.call(s => s.transition(t).attr("transform", l => `translate(${l.x},${l.y})`)),
      x => x.call(s => s.transition(t).attr("opacity", 0).attr("transform", l => `translate(${l.b.ox},${l.b.y})`).remove()));
    gNodes.node().appendChild(rootG.node());
    paint();
    gSyn.selectAll("*").remove(); stopPulses();
    setTimeout(drawSyn, dur + 20);
  }

  // representative position of a part (its leaf if open, else its branch pill)
  function rep(id){
    const l = leafById().get(id);
    if (l) return {x: l.x, y: l.y, key: id};
    const b = branchOfPart[id];
    return {x: b.cx, y: b.y, key: b.id};
  }
  const synPath = (a, b) => {
    if (Math.abs(a.x - b.x) < 2){ const sd = Math.sign(a.x) || 1; return `M${a.x},${a.y}Q${a.x + sd * (50 + Math.abs(a.y - b.y) * .35)},${(a.y + b.y) / 2} ${b.x},${b.y}`; }
    return `M${a.x},${a.y}Q${(a.x + b.x) / 2 * .15},${(a.y + b.y) / 2} ${b.x},${b.y}`;
  };

  let pulseTimer = null;
  function stopPulses(){ if (pulseTimer) pulseTimer.stop(); pulseTimer = null; gPulse.selectAll("*").remove(); }
  function pulses(items, loop){
    stopPulses();
    if (reducedMM || !items.length) return;
    items.forEach(it => it.c = gPulse.append("circle").attr("r", 3.8).attr("fill", it.color));
    pulseTimer = d3.timer(el => {
      let alive = false;
      items.forEach(it => {
        const len = it.path.getTotalLength();
        let p = el / 1400 + (it.off || 0);
        if (!loop && p > 1){ it.c.attr("opacity", 0); return; }
        alive = true; p = p % 1;
        const pt = it.path.getPointAtLength((it.rev ? 1 - p : p) * len);
        it.c.attr("cx", pt.x).attr("cy", pt.y).attr("opacity", Math.sin(p * Math.PI));
      });
      if (!alive) stopPulses();
    });
  }

  function drawSyn(){
    gSyn.selectAll("*").remove();
    const items = [];
    if (mmAll){
      const seen = new Set();
      D.edges.forEach(e => {
        const a = rep(e.s), b = rep(e.t);
        if (a.key === b.key) return;
        const k = a.key < b.key ? a.key + "|" + b.key : b.key + "|" + a.key;
        if (seen.has(k)) return; seen.add(k);
        gSyn.append("path").attr("class", "syn all").attr("d", synPath(a, b)).attr("stroke", branchOfPart[e.s].color);
      });
    }
    if (mmSel){
      const me = rep(mmSel);
      D.edges.filter(e => e.s === mmSel || e.t === mmSel).forEach((e, i) => {
        const out = e.s === mmSel, other = out ? e.t : e.s, o = rep(other);
        const p = gSyn.append("path").attr("class", "syn").attr("d", synPath(me, o)).attr("stroke", branchOfPart[other].color);
        items.push({path: p.node(), rev: !out, color: branchOfPart[out ? mmSel : other].color, off: (i * .13) % 1});
      });
      pulses(items, true);
    }
  }

  function paint(){
    const nb = new Set();
    if (mmSel) D.edges.forEach(e => { if (e.s === mmSel) nb.add(e.t); if (e.t === mmSel) nb.add(e.s); });
    const nbBranches = new Set([...nb].map(id => branchOfPart[id].id));
    gNodes.selectAll("g.leaf").classed("sel", l => l.id === mmSel).classed("hl", l => nb.has(l.id)).classed("dim", l => mmSel && l.id !== mmSel && !nb.has(l.id));
    gNodes.selectAll("g.branch").classed("hl", b => mmSel && !mmOpen.has(b.id) && nbBranches.has(b.id));
  }

  // ----- zoom -----
  const zoom = d3.zoom().scaleExtent([.2, 2.6]).on("zoom", ev => zroot.attr("transform", ev.transform));
  svg.call(zoom).on("dblclick.zoom", null);
  svg.on("click", () => { if (mmSel){ mmSel = null; paint(); drawSyn(); panelRoot(); } });
  function bounds(){
    let x0 = -70, x1 = 70, y0 = -70, y1 = 70;
    MMB.forEach(b => { x0 = Math.min(x0, b.side > 0 ? b.x : b.ox); x1 = Math.max(x1, b.side > 0 ? b.ox : b.x); y0 = Math.min(y0, b.y - 20); y1 = Math.max(y1, b.y + 38); });
    leaves.forEach(l => { const w = tw(byId.get(l.id).label, "13.5px") + 16; x0 = Math.min(x0, l.b.side > 0 ? l.x - 10 : l.x - w); x1 = Math.max(x1, l.b.side > 0 ? l.x + w : l.x + 10); y0 = Math.min(y0, l.y - 14); y1 = Math.max(y1, l.y + 14); });
    return [x0, y0, x1, y1];
  }
  function fit(anim = true){
    const box = document.getElementById("mmstage").getBoundingClientRect();
    const narrow = innerWidth <= 720;
    const top = 60, bot = narrow ? 64 : 20;
    const [x0, y0, x1, y1] = bounds();
    const k = Math.min(1.25, Math.min(box.width / (x1 - x0), (box.height - top - bot) / (y1 - y0)) * .94);
    const tf = d3.zoomIdentity.translate(box.width / 2 - k * (x0 + x1) / 2, top + (box.height - top - bot) / 2 - k * (y0 + y1) / 2).scale(k);
    (anim && !reducedMM ? svg.transition().duration(600) : svg).call(zoom.transform, tf);
  }
  function focusArea(x0, y0, x1, y1){
    const box = document.getElementById("mmstage").getBoundingClientRect();
    const narrow = innerWidth <= 720;
    const h = box.height - 60 - (narrow ? box.height * .45 : 20);
    const k = Math.max(narrow ? .8 : .55, Math.min(1.15, Math.min(box.width / (x1 - x0), h / (y1 - y0)) * .92));
    const tf = d3.zoomIdentity.translate(box.width / 2 - k * (x0 + x1) / 2, 60 + h / 2 - k * (y0 + y1) / 2).scale(k);
    (reducedMM ? svg : svg.transition().duration(600)).call(zoom.transform, tf);
  }

  // ----- actions -----
  function toggleBranch(b){
    const opening = !mmOpen.has(b.id);
    if (opening) mmOpen.add(b.id); else { mmOpen.delete(b.id); if (mmSel && branchOfPart[mmSel] === b) mmSel = null; }
    render();
    panelBranch(b);
    if (opening){
      const ls = leaves.filter(l => l.b === b);
      const xs = [b.x, b.ox, ...ls.map(l => l.x + b.side * (innerWidth <= 720 ? 150 : 200))], ys = [b.y - 20, b.y + 20, ...ls.map(l => l.y)];
      setTimeout(() => focusArea(d3.min(xs), d3.min(ys) - 10, d3.max(xs), d3.max(ys) + 10), dur ? 60 : 0);
    }
  }
  function selectPart(id, center){
    const b = branchOfPart[id];
    const needs = !mmOpen.has(b.id);
    mmSel = id;
    if (needs){ mmOpen.add(b.id); render(); } else { paint(); drawSyn(); }
    panelPart(id);
    if (center){
      const go2 = () => { const l = leafById().get(id); if (l) focusArea(Math.min(l.x, 0) - 80, l.y - 160, Math.max(l.x, 0) + 80, l.y + 160); };
      setTimeout(go2, needs ? dur + 30 : 0);
    }
  }

  // ----- panel -----
  const panel = document.getElementById("mmpanel");
  const handle = t => `<button class="sheet-handle" onclick="document.getElementById('mmpanel').classList.toggle('open')"><span>${esc(t)}</span><span class="muted">Details</span></button>`;
  const openSheet = () => panel.classList.add("open");
  function partRow(id, rel){
    const n = byId.get(id), c = branchOfPart[id].color;
    return `<li><button data-p="${id}"><i class="dot" style="--c:${c}"></i><span class="nm">${esc(n.label)}</span>${rel ? `<span class="rl">${esc(rel)}</span>` : ""}</button></li>`;
  }
  function bindPanel(){
    panel.querySelectorAll("[data-p]").forEach(el => el.onclick = () => selectPart(el.dataset.p, true));
    panel.querySelectorAll("[data-b]").forEach(el => el.onclick = () => toggleBranch(MMB.find(b => b.id === el.dataset.b)));
  }
  function panelRoot(){
    panel.innerHTML = handle("How to read this mind map") + `
      <h2>The Veltrix platform</h2>
      <p>Veltrix turns a company's orders, machines and stock into a plan that works, gets it approved, sends it to the floor and measures the result.</p>
      <p>On the right are the <b>eight steps</b> the work flows through. On the left is everything that <b>supports</b> those steps: people, screens, protection and the build team.</p>
      <p>Each coloured branch opens into its parts. Select a part and its connections light up across the map like signals between neurons.</p>
      <h3>The eight steps</h3><ul class="mmlist">${MMB.filter(b => b.side > 0).map(b => `<li><button data-b="${b.id}"><i class="dot" style="--c:${b.color}"></i><span class="nm">${b.num}. ${esc(b.title)}</span><span class="rl">${esc(b.q)}</span></button></li>`).join("")}</ul>
      <h3>What supports them</h3><ul class="mmlist">${MMB.filter(b => b.side < 0).map(b => `<li><button data-b="${b.id}"><i class="dot" style="--c:${b.color}"></i><span class="nm">${esc(b.title)}</span><span class="rl">${esc(b.q)}</span></button></li>`).join("")}</ul>`;
    bindPanel();
  }
  function panelBranch(b){
    panel.innerHTML = handle(b.title) + `
      <span class="tag" style="--c:${b.color}"><i class="dot"></i>${b.num ? "Step " + b.num + " of 8" : "Supports every step"}</span>
      <h2>${esc(b.title)}</h2><p class="muted">${esc(b.q)}</p><p>${esc(b.text)}</p>
      <h3>Its ${b.parts.length} parts</h3><ul class="mmlist">${b.parts.map(p => partRow(p)).join("")}</ul>
      <p style="margin-top:16px"><button class="btn" onclick="go('${b.link}')">Read this ${b.num ? "step" : "group"} as a page</button></p>`;
    bindPanel(); openSheet();
  }
  function panelPart(id){
    const n = byId.get(id), b = branchOfPart[id];
    const ins = D.edges.filter(e => e.t === id), outs = D.edges.filter(e => e.s === id);
    panel.innerHTML = handle(n.label) + `
      <span class="tag" style="--c:${b.color}"><i class="dot"></i>${b.num ? "Step " + b.num + ": " : ""}${esc(b.title)}</span>
      <h2>${esc(n.label)}</h2><p>${esc(n.easy)}</p>
      <h3>Gets from (${ins.length})</h3>${ins.length ? `<ul class="mmlist">${ins.map(e => partRow(e.s, e.label)).join("")}</ul>` : `<p class="muted">Nothing. It is a starting point.</p>`}
      <h3>Gives to (${outs.length})</h3>${outs.length ? `<ul class="mmlist">${outs.map(e => partRow(e.t, e.label)).join("")}</ul>` : `<p class="muted">Nothing. It is an end point.</p>`}
      <h3>Built in ${n.tasks.length} plan task${n.tasks.length === 1 ? "" : "s"}</h3>
      <ul class="tasks">${n.tasks.map(tid => { const t = taskById.get(tid); return `<li><button onclick="go('#/task/${tid}')"><span class="tid">${tid}</span><span class="tt">${esc(t.title)}</span><span class="own ${t.owner}">${AG[t.owner]}</span></button></li>`; }).join("")}</ul>
      <p style="margin-top:16px"><button class="btn" onclick="go('#/part/${id}')">Open the full page</button></p>`;
    bindPanel(); openSheet(); panel.scrollTop = 0;
  }

  // ----- tools -----
  document.getElementById("mmOpen").onclick = () => { MMB.forEach(b => mmOpen.add(b.id)); render(); setTimeout(fit, dur + 30); };
  document.getElementById("mmClose").onclick = () => { mmOpen.clear(); mmSel = null; render(); panelRoot(); setTimeout(fit, dur + 30); };
  document.getElementById("mmLinks").onclick = ev => { mmAll = !mmAll; ev.currentTarget.setAttribute("aria-pressed", mmAll); ev.currentTarget.innerHTML = (mmAll ? "Hide" : "Show") + ' <span class="wo">all </span>connections'; drawSyn(); };
  document.getElementById("mmFit").onclick = () => fit();
  window.onresize = () => { if (!document.getElementById("mm")) return; sizeIt(); };

  render();
  if (mmSel) panelPart(mmSel); else panelRoot();
  fit(false);
  // opening signal: pulses travel from the centre out along each branch
  setTimeout(() => {
    const items = gLinks.selectAll("path.rl").nodes().map((p, i) => ({path: p, color: MMB[i].color, off: -i * .04}));
    if (!mmSel) pulses(items, false);
  }, 250);
}

route();
</script>
</body>
</html>
