[project]
name = "nasq-api"
version = "0.1.0"
description = "Nasq application service (FastAPI)."
requires-python = ">=3.12,<3.13"
dependencies = [
  "nasq-core",
  "alembic==1.20.1",
  "fastapi==0.165.0",
  "uvicorn==0.54.0",
]

[tool.uv.sources]
nasq-core = { workspace = true }

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nasq_api"]
